[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dpsus"
version = "0.1.0"
description = "Dynamic Programming controller for active vehicle suspension (OJVT submission)"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
authors = [
    {name = "DP-Sus Research Team"},
]
keywords = ["active suspension", "dynamic programming", "vehicle dynamics", "OJVT"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pyyaml>=6.0",
    "matplotlib>=3.7",
    "pandas>=2.0",
    "control>=0.9",         # LQR baseline
    "cvxpy>=1.4",           # MPC QP solver
    "osqp>=0.6",            # Fast QP backend for MPC
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-xdist>=3.3",
    "flake8>=6.0",
    "black>=23.0",
    "isort>=5.12",
    "mypy>=1.5",
    "numba>=0.58",          # for Sprint 3 DP vectorization
    "joblib>=1.3",
    "jupyter>=1.0",
]

[project.urls]
"Homepage" = "https://github.com/your-org/dp-suspension-controller"
"Bug Tracker" = "https://github.com/your-org/dp-suspension-controller/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "7.4"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=dpsus",
    "--cov-report=term-missing",
    "--cov-report=html:results/coverage_html",
    "--cov-report=xml:results/coverage.xml",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "smoke: quick smoke tests for CI",
]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.flake8]
max-line-length = 100
extend-ignore = ["E203", "W503"]